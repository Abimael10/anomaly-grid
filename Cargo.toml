[package]
name = "anomaly-grid"
version = "0.4.2"
edition = "2021"
authors = ["Juan Abimael Santos Castillo"]
description = "Sequential pattern analysis through variable-order Markov chains. Built for detecting deviations in finite-alphabet sequences."
license = "MIT"
repository = "https://github.com/Abimael10/anomaly-grid"
keywords = [
    "anomaly-detection",
    "markov-chains",
    "sequence-modeling",
    "time-series",
    "log-analysis",
]
readme = "README.md"
categories = ["markov-chains","algorithms","data-structures","time-series","mathematics"]

[dependencies]
rayon = "1.10.0"
smallvec = "1.13.0"

[dev-dependencies]
rand = "0.8"
